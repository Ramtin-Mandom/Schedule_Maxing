# task_prefrence.yaml
# Keep this file in your project root or in config/task_prefrence.yaml.
# Note: this file keeps your spelling: "prefrence".
# reward.py also supports the corrected spelling: task_preference.yaml.

weights:
  importance: 5
  time_bonus: 3
  tag_relation: 2
  fragmentation_penalty: -4
  category_bonus: 1

preference:
  max_time_distance_minutes: 240
  same_tag_window_minutes: 120
  min_gap_between_tasks_minutes: 30

# Multiplies the priority reward by category.
# Example: study tasks become more valuable than entertainment tasks.
category_weights:
  study: 1.25
  work: 1.20
  exercise: 1.10
  errand: 1.00
  food: 0.90
  entertainment: 0.70
  other: 1.00

# Optional exact task multipliers.
# Use task names exactly as they appear in your CSV/input.
task_weights:
  Study Math: 1.30
  Math Review: 1.20
  Fill Gas: 0.95

# Optional preferred windows for exact task names.
# Times are minutes from midnight.
task_time_windows:
  Study Math:
    start_time: 540   # 09:00
    end_time: 720     # 12:00
  Math Review:
    start_time: 780   # 13:00
    end_time: 960     # 16:00

# Optional fallback windows by category.
category_time_windows:
  study:
    start_time: 540   # 09:00
    end_time: 1020    # 17:00
  exercise:
    start_time: 1020  # 17:00
    end_time: 1260    # 21:00
  food:
    start_time: 720   # 12:00
    end_time: 840     # 14:00

# Tags that should be rewarded when placed near each other.
tag_relations:
  math:
    - exam
    - homework
    - review
  car:
    - errand
  health:
    - exercise
