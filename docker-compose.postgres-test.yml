# OPTIONAL: a disposable local PostgreSQL for the `postgres`-marked tests and
# for trying the backend locally. Not needed by the desktop app or by the
# normal test suite. See docs/backend.md ("Tests") and docs/render-deployment.md.
#
#   docker compose -f docker-compose.postgres-test.yml up -d
#   TEST_DATABASE_URL=postgresql://sm_test@127.0.0.1:55432/schedule_maxing_test python -m pytest -m postgres
#   docker compose -f docker-compose.postgres-test.yml down -v    # deletes the container and its data
#
# It listens on 127.0.0.1 only and uses "trust" authentication, so there is
# no password to store anywhere. Never expose it beyond your machine, and
# never point TEST_DATABASE_URL at a real database (the tests refuse any
# database whose name does not contain "test").
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: sm_test
      POSTGRES_DB: schedule_maxing_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_test -d schedule_maxing_test"]
      interval: 2s
      timeout: 3s
      retries: 30
