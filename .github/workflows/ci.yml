name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Check compilation
        run: python -m compileall .

      - name: Run Ruff
        run: python -m ruff check .

  postgres:
    # The backend and sync suites against a real, throwaway PostgreSQL
    # (docs/backend.md). The service container uses trust authentication on the
    # runner's private network, so no secret is involved.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sm_test
          POSTGRES_DB: schedule_maxing_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm_test -d schedule_maxing_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://sm_test@localhost:5432/schedule_maxing_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: PostgreSQL-specific tests
        run: python -m pytest -m postgres tests/backend

      - name: Backend and sync suites on PostgreSQL
        run: python -m pytest tests/backend tests/sync
        env:
          BACKEND_TESTS_ON_POSTGRES: "1"
